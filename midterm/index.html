<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Operating Systems Midterm - 30 MCQ</title><style>
body{font-family:system-ui,sans-serif;margin:0;background:#f4f6f8;color:#16202a}main{max-width:760px;margin:auto;padding:16px}h1{font-size:22px}.q{background:#fff;border-radius:12px;padding:14px;margin:12px 0;box-shadow:0 1px 3px #0002}.q h2{font-size:17px;margin:0 0 10px;direction:ltr;text-align:left}.opts{direction:ltr;display:grid;gap:8px}.o{display:block;width:100%;text-align:left;padding:10px 12px;border:2px solid #cfd8e0;border-radius:10px;background:#fff;font-size:16px}.o.ok{border-color:#16a34a;background:#e3f6e9}.o.bad{border-color:#dc2626;background:#fde8e8}.meta{font-size:13px;color:#566}.ex{font-size:14px;color:#374151;line-height:1.7;margin:8px 0 0}.fb{margin:8px 0 0;font-weight:600}.fb.g{color:#15803d}.fb.r{color:#b91c1c}.score{position:sticky;top:0;background:#2563eb;color:#fff;padding:10px;border-radius:10px;margin:8px 0;z-index:2}.o.sel{border-color:#d97706;background:#fff4e0}.btn{padding:12px 18px;border-radius:10px;border:0;background:#64748b;color:#fff;font-size:16px;margin-top:8px}
</style></head><body><main><p class="meta">Midterm Exam - Operating Systems (UCCS2103) - 30 MCQ</p><h1>حل الـ30 سؤال، والتصحيح فوري</h1><p class="meta">نفس نص الأسئلة والاختيارات من الورقة. أول ما تدوس على اختيار بيظهر صح أو غلط، ولو غلط بتشوف الإجابة الصح وشرح السؤال وليه الإجابة دي هي الصح. من غير تسجيل، واختياراتك بتتمسح لو حدّثت الصفحة.</p><div id="score" class="score"></div><div id="qs"></div><button class="btn" id="reset">محاولة جديدة</button></main><script>
const Q=[{"n": 1, "q": "Which item is NOT among the 4 main components of a computer system?", "o": ["Middleware", "Hardware", "Applications", "Users"], "a": "A", "e": "المكونات الأربعة الأساسية لأي نظام كمبيوتر: الـHardware ونظام التشغيل والـApplication programs والـUsers. الـMiddleware مش منهم، دي طبقة برامج إضافية بتوصل بين نظام التشغيل والتطبيقات."}, {"n": 2, "q": "A device driver is classified as which type of component?", "o": ["A memory table", "A CPU register", "A hardware unit", "A software application"], "a": "D", "e": "الـdevice driver برنامج بيخلّي نظام التشغيل يتكلم مع قطعة هاردوير معينة، فهو software مش هاردوير."}, {"n": 3, "q": "What is another name for an Interrupt Service Routine (ISR)?", "o": ["Interrupt register", "Interrupt handler", "Interrupt controller", "Interrupt storage"], "a": "B", "e": "الـISR هي نفسها الـinterrupt handler: الكود اللي بيتنفذ لما يحصل interrupt معين."}, {"n": 4, "q": "Which storage type is fastest with the smallest capacity?", "o": ["Registers", "SSD", "RAM", "Cache"], "a": "A", "e": "في هرم الذاكرة الـRegisters أسرع وأصغر حاجة، بعدها الـCache، بعدها الـRAM، وبعدين التخزين الدائم زي الـSSD."}, {"n": 5, "q": "Which OS component remains active while the system is operating?", "o": ["Application", "Shell", "Middleware", "Kernel"], "a": "D", "e": "الـKernel هو قلب نظام التشغيل وبيفضل شغال في الذاكرة طول ما الجهاز شغال. الـshell والتطبيقات برامج عادية بتشتغل وتقفل."}, {"n": 6, "q": "Which group consists entirely of volatile storage components?", "o": ["SSDs, HDDs", "RAM, HDDs", "Registers, Cache", "Cache, SSDs"], "a": "C", "e": "الـvolatile يعني بيمسح لما الكهرباء تفصل. الـRegisters والـCache والـRAM volatile، أما الـHDD والـSSD تخزين دائم. الاختيار الوحيد اللي كله volatile هو Registers وCache."}, {"n": 7, "q": "What response time is desirable in interactive multitasking?", "o": ["More than one second", "Less than one second", "More than ten seconds", "Less than ten second"], "a": "B", "e": "في الأنظمة التفاعلية المطلوب إن الاستجابة تحس إنها فورية، يعني أقل من ثانية."}, {"n": 8, "q": "Which concept defends computer systems against attacks and threats?", "o": ["Clustering", "Scheduling", "Security", "Protection"], "a": "C", "e": "الـSecurity هي الدفاع عن النظام ضد الهجمات والتهديدات الخارجية. الـProtection بتنظم وصول العمليات والمستخدمين جوه النظام نفسه."}, {"n": 9, "q": "What is the term used when a user obtains additional access rights?", "o": ["Privilege escalation", "Mode switching", "User identification", "Group identification"], "a": "A", "e": "لما مستخدم ياخد صلاحيات أعلى من اللي معاه، ده اسمه privilege escalation، ولو حصل من غير إذن بيبقى هجوم."}, {"n": 10, "q": "What resource is commonly shared via a SAN in clustered computing?", "o": ["Storage", "Processors", "Devices", "Memory"], "a": "A", "e": "الـSAN (Storage Area Network) شبكة مخصصة إن أجهزة كتير في الـcluster تشارك نفس الـstorage."}, {"n": 11, "q": "Cloud computing can be viewed as a logical extension of which technology?", "o": ["Multitasking", "Emulation", "Virtualization", "Clustering only"], "a": "C", "e": "الـcloud computing امتداد منطقي للـvirtualization: إنك تشغّل موارد افتراضية (servers وstorage وnetworks) فوق هاردوير حقيقي عبر الإنترنت."}, {"n": 12, "q": "Which component provides and controls the CPU mode bit?", "o": ["The user", "The network", "Hardware", "Application software"], "a": "C", "e": "الـmode bit اللي بيفرّق بين kernel mode وuser mode موجود في الهاردوير نفسه، والـCPU بيستخدمه عشان يعرف المود الحالي."}, {"n": 13, "q": "Where are global and static variables typically stored in a process memory?", "o": ["Data section", "Stack section", "Text section", "Heap section"], "a": "A", "e": "المتغيرات الـglobal والـstatic بتتخزن في الـdata section. الـstack للمتغيرات المحلية واستدعاءات الدوال، والـheap للذاكرة الديناميكية، والـtext للكود نفسه."}, {"n": 14, "q": "Process memory section managing dynamically allocated memory:", "o": ["Data section", "Stack section", "Text section", "Heap section"], "a": "D", "e": "الذاكرة اللي بتتحجز أثناء التشغيل بـmalloc أو new بتتخزن وتتدار في الـheap."}, {"n": 15, "q": "Which process state means the CPU is actively executing the process?", "o": ["Ready", "Terminated", "Waiting", "Running"], "a": "D", "e": "Running يعني الـCPU شغال على العملية دلوقتي فعلًا. Ready يعني مستنية دورها، وWaiting يعني مستنية حدث زي I/O."}, {"n": 16, "q": "What is the term for the operation that transfers the CPU from one process to another?", "o": ["Context switch", "Context Transfering", "Process switch", "Process Transfering"], "a": "A", "e": "نقل الـCPU من عملية للتانية اسمه context switch: بنحفظ حالة (context) العملية الأولى ونحمّل حالة التانية."}, {"n": 17, "q": "Which UNIX system call is commonly used to create a new process?", "o": ["create()", "fork()", "call()", "frok()"], "a": "B", "e": "في UNIX العملية الجديدة بتتعمل بـfork()، وبيكون نسخة من العملية الأب."}, {"n": 18, "q": "Which PCB field stores the address of the process's next instruction?", "o": ["Process state", "I/O status", "Program counter", "Accounting information"], "a": "C", "e": "الـprogram counter جوه الـPCB بيخزن عنوان الأمر اللي هيتنفذ بعد كده لما العملية ترجع تكمل."}, {"n": 19, "q": "Given FCFS algorithm with P1 (AT=0, BT=7), P2 (AT=2, BT=10), P3 (AT=3, BT=6), how long does P2 wait?", "o": ["0", "10", "5", "3"], "a": "C", "e": "FCFS بيشتغل حسب ترتيب الوصول: P1 من 0 لـ7. P2 وصلت عند 2 واستنّت لحد ما P1 تخلص عند 7، يعني انتظارها = 7 − 2 = 5."}, {"n": 20, "q": "Four processes arrive simultaneously: P1 (BT=10), P2 (BT=4), P3 (BT=7), P4 (BT=13). With non-preemptive SJF, what's the average waiting time?", "o": ["6", "10.5", "7.5", "9"], "a": "D", "e": "SJF بيختار الأقصر الأول: الترتيب P2 (4) ثم P3 (7) ثم P1 (10) ثم P4 (13). الانتظار: 0 و4 و11 و21، والمتوسط = 36 ÷ 4 = 9."}, {"n": 21, "q": "For P1 (AT=0, BT=11), P2 (AT=2, BT=7), P3 (AT=4, BT=4), P4 (AT=6, BT=6) using preemptive SJF (SRTF), what is the average waiting time?", "o": ["7", "8", "6.25", "7.25"], "a": "X", "note": "السؤال ده مفيش فيه اختيار صح بالظبط. حسبتها SRTF: P1 تخلص عند 30 (WT 19)، P2 عند 13 (WT 4)، P3 عند 8 (WT 0)، P4 عند 19 (WT 7). المتوسط = 30 ÷ 4 = 7.5 ms، وده مش في الاختيارات. الورقة عليها علامة على A) 7، لكن ده مش الناتج الصحيح. السؤال مش محسوب في النتيجة."}, {"n": 22, "q": "P1 (BT=20), P2 (BT=7), P3 (BT=14) arrive together. Using RR with quantum=7, what's the average TAT?", "o": ["24", "26", "28", "30"], "a": "D", "e": "RR بـquantum 7: P1 من 0 لـ7، P2 من 7 لـ14 وتخلص (TAT 14)، P3 من 14 لـ21، P1 من 21 لـ28، P3 من 28 لـ35 وتخلص (TAT 35)، P1 من 35 لـ41 وتخلص (TAT 41). متوسط الـTAT = (41 + 14 + 35) ÷ 3 = 30."}, {"n": 23, "q": "P1 (BT=15), P2 (BT=7), P3 (BT=10) arrive together. Using RR with quantum=6, what's P3's waiting time?", "o": ["12", "15", "19", "23"], "a": "C", "e": "RR بـquantum 6: P1 من 0 لـ6، P2 من 6 لـ12، P3 من 12 لـ18، P1 من 18 لـ24، P2 من 24 لـ25 وتخلص، P3 من 25 لـ29 وتخلص. انتظار P3 = TAT − BT = 29 − 10 = 19."}, {"n": 24, "q": "For P1 (AT=0, BT=9, Pr=3), P2 (AT=1, BT=5, Pr=2), P3 (AT=3, BT=3, Pr=1), P4 (AT=5, BT=6, Pr=4) under preemptive priority scheduling, what's the average waiting time?", "o": ["4.75", "5.75", "6.75", "8.75"], "a": "B", "e": "الأولوية الأعلى للرقم الأصغر. P1 تبدأ، عند 1 تيجي P2 (أولوية أعلى) فتقطعها، عند 3 تيجي P3 (الأعلى) فتقطع وتخلص عند 6 (WT 0)، ثم P2 تكمل من 6 لـ9 (WT 3)، ثم P1 من 9 لـ17 (WT 8)، وP4 من 17 لـ23 (WT 12). المتوسط = (8 + 3 + 0 + 12) ÷ 4 = 5.75."}, {"n": 25, "q": "Which OS function records how users and processes utilize system resources?", "o": ["Protection", "Logging", "Communication", "Security"], "a": "B", "e": "تسجيل مين استخدم إيه وقد إيه من موارد النظام ده الـlogging (السجلات/المحاسبة). الـprotection والـsecurity بيمنعوا الوصول الغلط مش بيسجلوا الاستخدام."}, {"n": 26, "q": "Which programming interface is common to all OS platforms?", "o": ["Java API", "Win32 API", "DLM API", "POSIX API"], "a": "A", "e": "الـJava API هو نفسه على أي نظام تشغيل لأن البرنامج بيشتغل فوق الـJVM مش على النظام مباشرة. الـWin32 خاص بـWindows، والـPOSIX للأنظمة الشبيهة بـUNIX بس، فمش واحد منهم common لكل الأنظمة."}, {"n": 27, "q": "In Operating System design, what does the term policy specify?", "o": ["What to accomplish", "How to implement", "Hardware configuration", "File structure"], "a": "A", "e": "الـpolicy بتحدد إيه اللي هيتعمل (what will be done)، والـmechanism بتحدد إزاي (how to do it). مثال: المؤقت mechanism، أما مدته فدي policy."}, {"n": 28, "q": "OS architecture lacking clear module separation (e.g., MS-DOS):", "o": ["Layered architecture", "Microkernel architecture", "Modular architecture", "Simple structure"], "a": "D", "e": "MS-DOS اتبنى من غير فصل واضح بين المكونات والطبقات، وده اسمه simple structure. الـlayered فيه طبقات منظمة، والـmicrokernel بيقلل اللي جوه الـkernel لأقل حاجة."}, {"n": 29, "q": "Which architectural approach is used in modern OSs like Linux and Windows?", "o": ["Hybrid", "Microkernel", "Layered", "Monolithic"], "a": "A", "e": "الأنظمة الحديثة مش بتتقيد بأسلوب واحد: بتمزج monolithic مع layered مع modules عشان تجمع الأداء والمرونة، والدمج ده اسمه الـhybrid approach."}, {"n": 30, "q": "Which OS service lets users interact via CLI, GUI, or touch-screen?", "o": ["I/O operations", "Program execution", "User Interface", "Communications"], "a": "C", "e": "الـuser interface هي خدمة نظام التشغيل اللي بتخلّي المستخدم يتفاعل معاه، سواء بـCLI أو GUI أو شاشة لمس."}];let A={};const $=i=>document.getElementById(i);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){const G=Q.filter(q=>q.a!=='X'),n=G.filter(q=>A[q.n]).length,c=G.filter(q=>A[q.n]===q.a).length;
$('score').textContent='جاوبت '+n+' من 29 محسوبة - صح '+c+' - غلط '+(n-c)+' (سؤال 21 خارج النتيجة)';
$('qs').innerHTML=Q.map(q=>{const ch=A[q.n];return '<section class="q" id="q'+q.n+'"><div class="meta">Question '+q.n+' / 30</div><h2>'+esc(q.q)+'</h2><div class="opts">'+q.o.map((t,i)=>{const L='ABCD'[i];let k='o';if(ch&&q.a!=='X'){if(L===q.a)k+=' ok';else if(L===ch)k+=' bad';}else if(ch&&L===ch)k+=' sel';return '<button class="'+k+'" data-q="'+q.n+'" data-o="'+L+'" '+(ch?'disabled':'')+'>'+L+') '+esc(t)+(ch&&q.a!=='X'&&L===q.a?' ✓':'')+'</button>'}).join('')+'</div>'+(ch&&q.a==='X'?'<p class="fb r">مفيش اختيار صح بالظبط</p><p class="ex">'+esc(q.note)+'</p>':ch?'<p class="fb '+(ch===q.a?'g':'r')+'">'+(ch===q.a?'صح ✓':'غلط. الإجابة الصح: '+q.a+') '+esc(q.o['ABCD'.indexOf(q.a)]))+'</p>'+(ch!==q.a&&q.e?'<p class="ex">'+esc(q.e)+'</p>':'')+'':'')+'</section>'}).join('');}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
if(b.dataset.o&&!A[b.dataset.q]){A[b.dataset.q]=b.dataset.o;const y=window.scrollY;render();window.scrollTo(0,y);}
if(b.id==='reset'){A={};render();window.scrollTo(0,0);}});
render();</script></body></html>

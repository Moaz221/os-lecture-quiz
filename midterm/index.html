<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Operating Systems Midterm - 30 MCQ</title><style>
body{font-family:system-ui,sans-serif;margin:0;background:#f4f6f8;color:#16202a}main{max-width:760px;margin:auto;padding:16px}h1{font-size:22px}.q{background:#fff;border-radius:12px;padding:14px;margin:12px 0;box-shadow:0 1px 3px #0002}.q h2{font-size:17px;margin:0 0 10px;direction:ltr;text-align:left}.opts{direction:ltr;display:grid;gap:8px}.o{display:block;width:100%;text-align:left;padding:10px 12px;border:2px solid #cfd8e0;border-radius:10px;background:#fff;font-size:16px}.o.ok{border-color:#16a34a;background:#e3f6e9}.o.bad{border-color:#dc2626;background:#fde8e8}.meta{font-size:13px;color:#566}.fb{margin:8px 0 0;font-weight:600}.fb.g{color:#15803d}.fb.r{color:#b91c1c}.score{position:sticky;top:0;background:#2563eb;color:#fff;padding:10px;border-radius:10px;margin:8px 0;z-index:2}.btn{padding:12px 18px;border-radius:10px;border:0;background:#64748b;color:#fff;font-size:16px;margin-top:8px}
</style></head><body><main><p class="meta">Midterm Exam - Operating Systems (UCCS2103) - 30 MCQ</p><h1>حل الـ30 سؤال، والتصحيح فوري</h1><p class="meta">نفس نص الأسئلة والاختيارات من الورقة. أول ما تدوس على اختيار بيظهر صح أو غلط، ولو غلط بتشوف الإجابة الصح. من غير تسجيل، واختياراتك بتتمسح لو حدّثت الصفحة.</p><div id="score" class="score"></div><div id="qs"></div><button class="btn" id="reset">محاولة جديدة</button></main><script>
const Q=[{"n": 1, "q": "Which item is NOT among the 4 main components of a computer system?", "o": ["Middleware", "Hardware", "Applications", "Users"], "a": "A"}, {"n": 2, "q": "A device driver is classified as which type of component?", "o": ["A memory table", "A CPU register", "A hardware unit", "A software application"], "a": "D"}, {"n": 3, "q": "What is another name for an Interrupt Service Routine (ISR)?", "o": ["Interrupt register", "Interrupt handler", "Interrupt controller", "Interrupt storage"], "a": "B"}, {"n": 4, "q": "Which storage type is fastest with the smallest capacity?", "o": ["Registers", "SSD", "RAM", "Cache"], "a": "A"}, {"n": 5, "q": "Which OS component remains active while the system is operating?", "o": ["Application", "Shell", "Middleware", "Kernel"], "a": "D"}, {"n": 6, "q": "Which group consists entirely of volatile storage components?", "o": ["SSDs, HDDs", "RAM, HDDs", "Registers, Cache", "Cache, SSDs"], "a": "C"}, {"n": 7, "q": "What response time is desirable in interactive multitasking?", "o": ["More than one second", "Less than one second", "More than ten seconds", "Less than ten second"], "a": "B"}, {"n": 8, "q": "Which concept defends computer systems against attacks and threats?", "o": ["Clustering", "Scheduling", "Security", "Protection"], "a": "C"}, {"n": 9, "q": "What is the term used when a user obtains additional access rights?", "o": ["Privilege escalation", "Mode switching", "User identification", "Group identification"], "a": "A"}, {"n": 10, "q": "What resource is commonly shared via a SAN in clustered computing?", "o": ["Storage", "Processors", "Devices", "Memory"], "a": "A"}, {"n": 11, "q": "Cloud computing can be viewed as a logical extension of which technology?", "o": ["Multitasking", "Emulation", "Virtualization", "Clustering only"], "a": "C"}, {"n": 12, "q": "Which component provides and controls the CPU mode bit?", "o": ["The user", "The network", "Hardware", "Application software"], "a": "C"}, {"n": 13, "q": "Where are global and static variables typically stored in a process memory?", "o": ["Data section", "Stack section", "Text section", "Heap section"], "a": "A"}, {"n": 14, "q": "Process memory section managing dynamically allocated memory:", "o": ["Data section", "Stack section", "Text section", "Heap section"], "a": "D"}, {"n": 15, "q": "Which process state means the CPU is actively executing the process?", "o": ["Ready", "Terminated", "Waiting", "Running"], "a": "D"}, {"n": 16, "q": "What is the term for the operation that transfers the CPU from one process to another?", "o": ["Context switch", "Context Transfering", "Process switch", "Process Transfering"], "a": "A"}, {"n": 17, "q": "Which UNIX system call is commonly used to create a new process?", "o": ["create()", "fork()", "call()", "frok()"], "a": "B"}, {"n": 18, "q": "Which PCB field stores the address of the process's next instruction?", "o": ["Process state", "I/O status", "Program counter", "Accounting information"], "a": "C"}, {"n": 19, "q": "Given FCFS algorithm with P1 (AT=0, BT=7), P2 (AT=2, BT=10), P3 (AT=3, BT=6), how long does P2 wait?", "o": ["0", "10", "5", "3"], "a": "C"}, {"n": 20, "q": "Four processes arrive simultaneously: P1 (BT=10), P2 (BT=4), P3 (BT=7), P4 (BT=13). With non-preemptive SJF, what's the average waiting time?", "o": ["6", "10.5", "7.5", "9"], "a": "D"}, {"n": 21, "q": "For P1 (AT=0, BT=11), P2 (AT=2, BT=7), P3 (AT=4, BT=4), P4 (AT=6, BT=6) using preemptive SJF (SRTF), what is the average waiting time?", "o": ["7", "8", "6.25", "7.25"], "a": "A", "note": "\u062a\u0646\u0628\u064a\u0647: \u062f\u0647 \u0645\u0641\u062a\u0627\u062d \u0627\u0644\u0648\u0631\u0642\u0629. \u0623\u0646\u0627 \u062d\u0633\u0628\u062a\u0647\u0627 SRTF: P1 \u062a\u062e\u0644\u0635 30 (WT 19)\u060c P2 13 (WT 4)\u060c P3 8 (WT 0)\u060c P4 19 (WT 7). \u0627\u0644\u0645\u062a\u0648\u0633\u0637 30\u00f74 = 7.5\u060c \u0645\u0634 \u0645\u0648\u062c\u0648\u062f \u0628\u0627\u0644\u0638\u0628\u0637 \u0641\u064a \u0627\u0644\u0627\u062e\u062a\u064a\u0627\u0631\u0627\u062a. \u0627\u0644\u0623\u0642\u0631\u0628 7 (A)."}, {"n": 22, "q": "P1 (BT=20), P2 (BT=7), P3 (BT=14) arrive together. Using RR with quantum=7, what's the average TAT?", "o": ["24", "26", "28", "30"], "a": "D"}, {"n": 23, "q": "P1 (BT=15), P2 (BT=7), P3 (BT=10) arrive together. Using RR with quantum=6, what's P3's waiting time?", "o": ["12", "15", "19", "23"], "a": "C"}, {"n": 24, "q": "For P1 (AT=0, BT=9, Pr=3), P2 (AT=1, BT=5, Pr=2), P3 (AT=3, BT=3, Pr=1), P4 (AT=5, BT=6, Pr=4) under preemptive priority scheduling, what's the average waiting time?", "o": ["4.75", "5.75", "6.75", "8.75"], "a": "B"}, {"n": 25, "q": "Which OS function records how users and processes utilize system resources?", "o": ["Protection", "Logging", "Communication", "Security"], "a": "B"}, {"n": 26, "q": "Which programming interface is common to all OS platforms?", "o": ["Java API", "Win32 API", "DLM API", "POSIX API"], "a": "A"}, {"n": 27, "q": "In Operating System design, what does the term policy specify?", "o": ["What to accomplish", "How to implement", "Hardware configuration", "File structure"], "a": "A"}, {"n": 28, "q": "OS architecture lacking clear module separation (e.g., MS-DOS):", "o": ["Layered architecture", "Microkernel architecture", "Modular architecture", "Simple structure"], "a": "D"}, {"n": 29, "q": "Which architectural approach is used in modern OSs like Linux and Windows?", "o": ["Hybrid", "Microkernel", "Layered", "Monolithic"], "a": "A"}, {"n": 30, "q": "Which OS service lets users interact via CLI, GUI, or touch-screen?", "o": ["I/O operations", "Program execution", "User Interface", "Communications"], "a": "C"}];let A={};const $=i=>document.getElementById(i);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){const n=Object.keys(A).length,c=Q.filter(q=>A[q.n]===q.a).length;
$('score').textContent='جاوبت '+n+' من 30 - صح '+c+' - غلط '+(n-c);
$('qs').innerHTML=Q.map(q=>{const ch=A[q.n];return '<section class="q" id="q'+q.n+'"><div class="meta">Question '+q.n+' / 30</div><h2>'+esc(q.q)+'</h2><div class="opts">'+q.o.map((t,i)=>{const L='ABCD'[i];let k='o';if(ch){if(L===q.a)k+=' ok';else if(L===ch)k+=' bad';}return '<button class="'+k+'" data-q="'+q.n+'" data-o="'+L+'" '+(ch?'disabled':'')+'>'+L+') '+esc(t)+(ch&&L===q.a?' ✓':'')+'</button>'}).join('')+'</div>'+(ch?'<p class="fb '+(ch===q.a?'g':'r')+'">'+(ch===q.a?'صح ✓':'غلط. الإجابة الصح: '+q.a+') '+esc(q.o['ABCD'.indexOf(q.a)]))+'</p>'+(q.note?'<p class="meta">'+esc(q.note)+'</p>':''):'')+'</section>'}).join('');}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
if(b.dataset.o&&!A[b.dataset.q]){A[b.dataset.q]=b.dataset.o;const y=window.scrollY;render();window.scrollTo(0,y);}
if(b.id==='reset'){A={};render();window.scrollTo(0,0);}});
render();</script></body></html>
